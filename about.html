greet:{
 ko:`<div class="quote">"관문의 도시 인천을, 머물고 싶은 여행지로."</div>
<div class="prose">
<p>안녕하십니까. 사단법인 인천광역시관광협의회 회장 김재오입니다.</p>
<p>인천광역시관광협의회는 관광진흥법 제48조의9와 인천광역시 관광진흥 조례에 근거해 2019년 설립된 지역관광협의회로, 관광객 유치와 홍보, 관광사업의 진흥, 회원의 공제와 복리 증진, 그리고 지역 관광산업의 성장과 발전에 기여하는 것을 목적으로 합니다(정관 제2조).</p>
<p>협의회는 창립 이래 인천시 관광안내소 10개소의 수탁 운영(2020~2023, 민간위탁 종합성과평가 '우수'), 여행업 리스타트 관광상품 지원사업(39개 업체·1,706명), 관광기념품 공모전, 클린관광 캠페인, 한중 문화예술 교류전, 인천 글로벌 K-POP 콘서트 홍보·모객 지원 등 현장에서 검증된 사업을 수행해 왔습니다.</p>
<p>인천은 연간 7천만 명이 넘는 국제여객이 오가는 대한민국의 관문이자, 개항의 역사와 168개 섬, 송도의 미래 도시를 한 곳에 품은 도시입니다. 그러나 많은 이들이 인천을 '지나가기만' 합니다. 협의회는 공항·항만의 통과 수요를 체류 수요로 바꾸고, 서울과 경쟁이 아닌 보완의 관계 속에서 "서울 오는 김에, 가기 전에 인천"을 설계하겠습니다.</p>
<p>관광은 콘텐츠만으로 완성되지 않습니다. 수요를 데이터로 검증하고, 지역에 수익이 환류되는 구조를 만들며, 주민의 삶과 상생하는 거버넌스를 세우는 일 — 민·관·학이 함께하는 협의회가 그 역할을 하겠습니다. 회원사와 시민, 그리고 인천을 찾는 모든 여행자 여러분의 관심과 참여를 부탁드립니다.</p>
</div>
<div class="signature"><span>사단법인 인천광역시관광협의회 회장</span><span class="name">김 재 오</span></div>`,
 en:`<div class="quote">"From Korea's gateway city to a destination worth staying in."</div>
<div class="prose">
<p>Greetings. I am Kim Jae-oh, Chairman of the Incheon Tourism Council.</p>
<p>Established in 2019 under Article 48-9 of the Tourism Promotion Act and the Incheon Tourism Promotion Ordinance, the Council exists to attract and promote visitors, advance the tourism industry, serve the mutual benefit and welfare of our members, and contribute to the growth of regional tourism (Article 2 of our Articles of Association).</p>
<p>Since our founding we have operated all ten of Incheon's tourist information centers (2020–2023, rated "Excellent" in the city's outsourcing evaluation), run the travel-industry Restart program (39 agencies, 1,706 travelers), the Incheon souvenir design competition, clean tourism campaigns, Korea–China cultural exchanges, and audience mobilization for the Incheon global K-POP concerts.</p>
<p>Incheon is Korea's gateway, welcoming over 70 million international passengers a year, with the history of the 1883 port opening, 168 islands and the future city of Songdo in one place. Yet many only pass through. The Council will turn transit demand into stays — not in competition with Seoul but as its complement: "Incheon, before or after Seoul."</p>
<p>Tourism is not made of content alone. It needs demand verified by data, revenue that flows back to the region, and governance that shares benefits with residents. As a public–private–academic council, that is our role. I ask for the interest and participation of our members, citizens and every traveler who visits Incheon.</p>
</div>
<div class="signature"><span>Chairman, Incheon Tourism Council</span><span class="name">Kim Jae-oh</span></div>`,
 ja:`<div class="quote">「玄関口の都市・仁川を、滞在したい旅先へ。」</div>
<div class="prose">
<p>社団法人仁川広域市観光協議会 会長の金在五（キム・ジェオ）です。</p>
<p>当協議会は観光振興法第48条の9と仁川広域市観光振興条例に基づき2019年に設立された地域観光協議会で、観光客の誘致・広報、観光事業の振興、会員の共済・福利増進、地域観光産業の成長と発展への貢献を目的としています（定款第2条）。</p>
<p>設立以来、仁川市観光案内所10か所の受託運営（2020〜2023、市評価「優秀」）、旅行業リスタート支援事業、観光記念品公募展、クリーン観光キャンペーン、韓中文化芸術交流展、仁川グローバルK-POPコンサートの広報・集客支援など、現場で実証された事業を行ってきました。</p>
<p>仁川は年間7千万人を超える国際旅客が行き交う韓国の玄関口であり、開港の歴史、168の島、松島の未来都市をひとつに抱く都市です。協議会は空港・港湾の通過需要を滞在需要へ変え、ソウルと競争ではなく補完の関係の中で「ソウルの前に、後に、仁川」を設計します。</p>
<p>会員社、市民、そして仁川を訪れるすべての旅行者の皆様のご関心とご参加をお願い申し上げます。</p>
</div>
<div class="signature"><span>仁川広域市観光協議会 会長</span><span class="name">金 在 五</span></div>`,
 zh:`<div class="quote">“让门户之城仁川，成为值得驻留的旅行目的地。”</div>
<div class="prose">
<p>您好，我是社团法人仁川广域市观光协议会会长金在五。</p>
<p>协议会依据《观光振兴法》第48条之9及仁川广域市观光振兴条例于2019年设立，以吸引与宣传游客、振兴旅游产业、增进会员互助福利、促进地区旅游产业成长发展为宗旨（章程第2条）。</p>
<p>成立以来，我们受托运营仁川市全部10处旅游咨询处（2020—2023年，市评价“优秀”），运营旅行业重启支持项目、旅游纪念品征集大赛、清洁旅游活动、韩中文化艺术交流展，并为仁川全球K-POP演唱会提供宣传与集客支持。</p>
<p>仁川是每年逾七千万国际旅客往来的韩国门户，集开港历史、168座岛屿与松岛未来之城于一身。协议会将把机场、港口的过境需求转化为驻留需求，与首尔形成互补而非竞争——“去首尔之前、之后，先到仁川”。</p>
<p>恳请各会员单位、市民以及每一位到访仁川的旅行者给予关注与参与。</p>
</div>
<div class="signature"><span>仁川广域市观光协议会 会长</span><span class="name">金 在 五</span></div>`

 en:`<div class="vision-top rv"><div class="big">A public–private–academic DMO opening the era of<br>"3 million foreign visitors to Incheon"</div><p class="lead" style="margin-top:12px">Article 2 (Purpose): attract and promote visitors, advance the tourism industry and members' mutual benefit, and contribute to the growth of regional tourism.</p></div>

 ja:`<div class="vision-top rv"><div class="big">「仁川 外国人300万観光時代」を開く<br>官民学協力DMO</div><p class="lead" style="margin-top:12px">定款第2条（目的）— 観光客の誘致・広報、観光事業の振興と会員の共済・福利増進、地域観光産業の成長と発展への貢献</p></div>
<div class="mv rv"><div class="box m"><small>MISSION</small><strong>仁川観光の活性化、観光資源開発、地域経済の発展</strong></div><div class="box v"><small>VISION</small><strong>玄関口（Gateway）から滞在地（Destination）へ — 仁川観光の官民協力プラットフォーム</strong></div></div>
<div class="pillars">
<div class="pillar rv"><div class="no">STRATEGY 01</div><h3>誘致 — 乗継需要の純増</h3><p>仁川空港乗継客（2025年804.6万人）とインバウンドを仁川の拠点へ。ソウルとゼロサムでない純増需要を創出。</p></div>
<div class="pillar rv d1"><div class="no">STRATEGY 02</div><h3>滞在 — 拠点コンテンツ</h3><p>開港場・月尾島、松島MICE、永宗リゾート、江華・島のテーマを束ね、滞在時間と客単価を高める。</p></div>
<div class="pillar rv d2"><div class="no">STRATEGY 03</div><h3>還流 — 地域帰属の収益構造</h3><p>観光消費が地域事業者に還流する会員中心のサプライチェーンを構築。</p></div>
<div class="pillar rv d3"><div class="no">STRATEGY 04</div><h3>共生 — 住民・会員ガバナンス</h3><p>住民満足度とクリーン観光をKPIに含め、分科委員会・郡区支会で共に決定。</p></div>
</div>`,
 zh:`<div class="vision-top rv"><div class="big">开启“仁川外国游客300万时代”的<br>官民学合作DMO</div><p class="lead" style="margin-top:12px">章程第2条（宗旨）— 吸引与宣传游客、振兴旅游产业与会员互助福利、促进地区旅游产业成长发展</p></div>
<div class="mv rv"><div class="box m"><small>MISSION</small><strong>振兴仁川旅游、开发旅游资源、发展地区经济</strong></div><div class="box v"><small>VISION</small><strong>从门户（Gateway）到目的地（Destination）— 仁川旅游的官民合作平台</strong></div></div>
<div class="pillars">
<div class="pillar rv"><div class="no">STRATEGY 01</div><h3>吸引 — 中转需求净增</h3><p>将仁川机场中转旅客（2025年804.6万人）与入境游客引至仁川各据点，创造与首尔非零和的净增需求。</p></div>
<div class="pillar rv d1"><div class="no">STRATEGY 02</div><h3>驻留 — 据点内容</h3><p>整合开港场·月尾岛、松岛MICE、永宗度假村、江华与海岛主题，提升停留时间与客单价。</p></div>
<div class="pillar rv d2"><div class="no">STRATEGY 03</div><h3>回流 — 地区收益结构</h3><p>构建以会员为中心的供应链，使旅游消费回流至地区经营者。</p></div>
<div class="pillar rv d3"><div class="no">STRATEGY 04</div><h3>共生 — 居民·会员治理</h3><p>将居民满意度与清洁旅游纳入KPI，通过分科委员会与郡区支会共同决策。</p></div>
</div>`
},
ethics:{
 ko:`<div class="grid-2">
<div class="prose rv" style="max-width:100%"><h3>윤리헌장</h3><p>사단법인 인천광역시관광협의회는 인천광역시로부터 인가받은 비영리 사단법인으로서, 지역관광 진흥이라는 공공의 목적을 수행함에 있어 다음과 같이 윤리경영을 실천할 것을 다짐합니다.</p>
<ul><li><b>공정과 투명</b> — 모든 사업과 예산 집행을 공정하게 수행하고 예산·결산 및 기부금 실적을 공개한다(정관 제36조의2).</li>
<li><b>이해충돌 방지</b> — 임원은 자신과 협의회의 이해가 상반되는 의결에 참여하지 않는다(정관 제24조·제30조).</li>
<li><b>청렴</b> — 임직원은 직무와 관련하여 금품·향응을 수수하지 않으며, 임원은 명예직으로 보수를 받지 않는다(정관 제12조·제37조).</li>
<li><b>회원 존중</b> — 회원의 권리를 보장하고 회원 간 분쟁을 공정하게 조정한다(정관 제8조·제40조).</li>
<li><b>지역 상생</b> — 관광 활성화가 주민의 삶의 질과 환경을 해치지 않도록 클린관광을 실천한다.</li></ul>
<h3>임직원 행동강령</h3><table><tr><th>영역</th><th>원칙</th></tr>
<tr><td>직무 수행</td><td>법령·정관·규정 준수, 총회·이사회 결의 성실 이행(정관 제9조)</td></tr>
<tr><td>재산·회계</td><td>기본재산 처분은 이사회·총회 의결, 서면결의 금지, 회계감사 연 1회(제29조·제32조·제36조)</td></tr>
<tr><td>위탁사업</td><td>정부·지자체 위탁사업의 목적 외 사용 금지, 성과 보고 의무(제44조)</td></tr>
<tr><td>정보 보호</td><td>회원·이용자 개인정보의 목적 외 이용 금지</td></tr>
<tr><td>징계</td><td>목적 위배·회계부정·현저한 부당행위 시 이사회 의결로 해임(제16조)</td></tr></table></div>
<div class="rv d1"><div class="ci-box"><h3>청렴 신고 · 상담 채널</h3><p style="font-size:.95rem;color:var(--c-muted);line-height:1.7">임직원의 부당행위, 이해충돌, 회계 부정 등을 알고 계시다면 아래 채널로 신고해 주십시오. 신고자의 신원은 보호되며 불이익을 받지 않습니다.</p>
<ul class="prose" style="margin-top:12px;font-size:.95rem"><li>이메일 : <a href="mailto:incheontour1@gmail.com" style="color:var(--c-primary)">incheontour1@gmail.com</a></li><li>전화 : +82-10-5238-5443</li><li>우편 : 인천광역시 남동구 구월남로 118 YMCA회관 501호 (감사 앞)</li></ul>
<p style="font-size:.85rem;color:var(--c-muted);margin-top:12px">신고 사항은 감사(정관 제18조 제4항)가 조사하여 이사회 또는 총회에 보고하고 필요 시 주무관청에 보고합니다.</p></div>
<div class="ci-box" style="margin-top:18px"><h3>윤리경영 추진 체계</h3><table class="prose" style="font-size:.9rem;width:100%"><tr><th>주체</th><th>역할</th></tr><tr><td>이사회</td><td>윤리 규정 제·개정, 징계 의결</td></tr><tr><td>감사 (2인)</td><td>재산·업무 감사, 시정 요구, 주무관청 보고</td></tr><tr><td>사무국</td><td>행동강령 교육, 신고 접수·처리</td></tr><tr><td>회원</td><td>정관·규약 준수, 공익 제보</td></tr></table></div>
<div class="ci-box" style="margin-top:18px"><h3>재정 투명성</h3><p style="font-size:.92rem;color:var(--c-muted)">2025년 3월 기준 부채 ZERO. 회계연도 종료 후 2개월 이내 사업실적·수지결산·감사결과를 주무관청에 보고하며(정관 제44조), 연간 기부금 모금·활용 실적을 매년 3월 홈페이지에 공개합니다.</p></div></div></div>`,
 en:`<div class="grid-2"><div class="prose rv" style="max-width:100%"><h3>Ethics Charter</h3><p>As a non-profit association authorized by Incheon Metropolitan City, the Council commits to ethical management in serving the public purpose of regional tourism promotion.</p>
<ul><li><b>Fairness & transparency</b> — fair execution of all projects and budgets; disclosure of budgets, settlements and donations (Art. 36-2).</li><li><b>Conflict of interest</b> — directors abstain from resolutions where their interests conflict with the Council's (Art. 24, 30).</li><li><b>Integrity</b> — no gifts or entertainment related to duties; officers serve honorarily without pay (Art. 12, 37).</li><li><b>Respect for members</b> — members' rights guaranteed; disputes mediated fairly (Art. 8, 40).</li><li><b>Community</b> — clean tourism so that growth never harms residents' quality of life.</li></ul>
<h3>Code of Conduct</h3><table><tr><th>Area</th><th>Principle</th></tr><tr><td>Duties</td><td>Comply with laws, charter and rules; implement resolutions (Art. 9)</td></tr><tr><td>Assets & accounts</td><td>Board and assembly approval for basic assets; no written-only resolutions; annual audit (Art. 29, 32, 36)</td></tr><tr><td>Entrusted projects</td><td>No off-purpose use; reporting duty (Art. 44)</td></tr><tr><td>Privacy</td><td>No off-purpose use of personal data</td></tr><tr><td>Discipline</td><td>Removal by board resolution for misconduct (Art. 16)</td></tr></table></div>
<div class="rv d1"><div class="ci-box"><h3>Integrity reporting channel</h3><p style="font-size:.95rem;color:var(--c-muted)">Report misconduct, conflicts of interest or accounting irregularities. Reporters are protected.</p><ul class="prose" style="margin-top:12px;font-size:.95rem"><li>Email: incheontour1@gmail.com</li><li>Tel: +82-10-5238-5443</li><li>Mail: Rm 501, YMCA Bldg, 118 Guwolnam-ro, Namdong-gu, Incheon (Attn: Auditor)</li></ul></div>
<div class="ci-box" style="margin-top:18px"><h3>Financial transparency</h3><p style="font-size:.92rem;color:var(--c-muted)">Zero debt as of March 2025. Results, settlement and audit reported to the supervising authority within two months of fiscal year-end (Art. 44); donation records published every March.</p></div></div></div>`,
 ja:`<div class="grid-2"><div class="prose rv" style="max-width:100%"><h3>倫理憲章</h3><p>仁川広域市の認可を受けた非営利社団法人として、地域観光振興という公共目的の遂行において倫理経営を実践します。</p><ul><li><b>公正と透明</b> — 予算・決算および寄付金実績の公開（定款第36条の2）</li><li><b>利害衝突の防止</b> — 役員は自身と協議会の利害が相反する議決に参加しない（第24条・第30条）</li><li><b>清廉</b> — 職務に関連する金品・接待の授受禁止、役員は名誉職（第12条・第37条）</li><li><b>会員の尊重</b> — 会員の権利保障と公正な紛争調整（第8条・第40条）</li><li><b>地域共生</b> — クリーン観光の実践</li></ul></div>
<div class="rv d1"><div class="ci-box"><h3>清廉通報チャンネル</h3><ul class="prose" style="font-size:.95rem"><li>メール：incheontour1@gmail.com</li><li>電話：+82-10-5238-5443</li><li>郵便：仁川広域市南洞区九月南路118 YMCA会館501号（監事宛）</li></ul></div><div class="ci-box" style="margin-top:18px"><h3>財政透明性</h3><p style="font-size:.92rem;color:var(--c-muted)">2025年3月現在、負債ゼロ。会計年度終了後2か月以内に事業実績・決算・監査結果を主務官庁に報告（第44条）。</p></div></div></div>`,
 zh:`<div class="grid-2"><div class="prose rv" style="max-width:100%"><h3>伦理宪章</h3><p>作为获仁川广域市批准的非营利社团法人，协议会在履行地区旅游振兴公共职能时践行伦理经营。</p><ul><li><b>公正与透明</b> — 公开预算、决算及捐款实绩（章程第36条之2）</li><li><b>防止利益冲突</b> — 理事不参与与自身利益相冲突的表决（第24条·第30条）</li><li><b>廉洁</b> — 禁止收受与职务相关的财物与招待，理事为名誉职（第12条·第37条）</li><li><b>尊重会员</b> — 保障会员权利，公正调解纠纷（第8条·第40条）</li><li><b>地区共生</b> — 践行清洁旅游</li></ul></div>
<div class="rv d1"><div class="ci-box"><h3>廉政举报渠道</h3><ul class="prose" style="font-size:.95rem"><li>邮箱：incheontour1@gmail.com</li><li>电话：+82-10-5238-5443</li><li>邮寄：仁川广域市南洞区九月南路118 YMCA会馆501号（监事收）</li></ul></div><div class="ci-box" style="margin-top:18px"><h3>财务透明</h3><p style="font-size:.92rem;color:var(--c-muted)">截至2025年3月负债为零。会计年度结束后2个月内向主管机关报告事业实绩、决算与审计结果（第44条）。</p></div></div></div>`

 ko:{sym:"심볼마크",symD:"파란 원 위에 흰 초승달이 인천의 바다를 감싸고, 그 안에 인천대교의 주탑·돛(개항의 바다)과 날아오르는 비행기(관문 인천공항)를 담았습니다. 원은 포용과 협력, 블루 그라데이션은 바다·하늘·미래 도시를 상징합니다.",sig:"시그니처 (가로·세로형)",sigD:"심볼과 로고타입의 조합. 가로형을 기본으로 하며, 세로형은 좁은 공간이나 세로 매체에 사용합니다. '사단법인' 표기는 공식 문서와 대외 서명에 반드시 포함합니다.",col:"전용 색상",colD:"협의회 로고의 색상은 아래 네 가지로 규정하며, 임의로 변경하거나 다른 색을 사용하지 않습니다.",font:"전용 서체",fontD:"로고타입 국문은 '이순신 돋음 B', 영문은 'Noto Sans Korean Bold'를 사용합니다. 본문 및 웹에서는 Pretendard를 기본 서체로 사용합니다.",rule:"사용 규정",rules:["심볼의 비례·색상·구성 요소를 변형하지 않습니다.","최소 여백: 심볼 높이의 1/4 이상, 최소 크기: 가로형 시그니처 가로 30mm(인쇄) / 120px(웹).","배경이 어두운 경우 반전형(흰색) 시그니처를, 단색 인쇄는 Black 또는 Gray 버전을 사용합니다.","사진 위 배치 시 가독성 확보를 위해 밝은 영역 또는 반투명 바탕 위에 사용합니다.","영문 표기: 정관상 공식 영문명은 Incheon Tourism Council(약칭 I.T.C). 로고타입의 'INCHEON TOURISM ASSOCIATION'은 정관 개정 또는 로고 개정으로 통일할 예정입니다. [확인 필요]"],dl:"CI 다운로드",symA:"컬러",symB:"그레이",symC:"블랙",symR:"반전형",member:"회원사 엠블럼"},
 en:{sym:"Symbol",symD:"A white crescent on a blue circle embraces Incheon's sea, holding the Incheon Bridge pylons and sails (the sea of the open port) and a rising airplane (Incheon Airport, the gateway). The circle stands for inclusion and cooperation; the blue gradient for sea, sky and the future city.",sig:"Signature (horizontal / vertical)",sigD:"Symbol combined with logotype. The horizontal signature is the default; use the vertical version in narrow spaces. The '사단법인' (incorporated association) mark must appear on official documents.",col:"Primary colors",colD:"Only the four colors below are permitted for the logo.",font:"Typefaces",fontD:"Logotype: 'Yi Sun-sin Dotum B' (Korean) and 'Noto Sans Korean Bold' (English). Body and web: Pretendard.",rule:"Usage rules",rules:["Do not alter proportions, colors or elements of the symbol.","Clear space: at least 1/4 of symbol height. Minimum size: 30 mm (print) / 120 px (web) for the horizontal signature.","Use the reversed (white) signature on dark backgrounds; Black or Gray versions for single-color printing.","On photographs, place on bright areas or a translucent panel for legibility.","Official English name per charter: Incheon Tourism Council (I.T.C). The logotype's 'INCHEON TOURISM ASSOCIATION' is to be unified by charter or logo revision. [to be confirmed]"],dl:"Download CI",symA:"Color",symB:"Gray",symC:"Black",symR:"Reversed",member:"Member emblem"},
 ja:{sym:"シンボルマーク",symD:"青い円の上の白い三日月が仁川の海を包み、仁川大橋の主塔・帆（開港の海）と飛び立つ飛行機（玄関口・仁川空港）を表現。円は包容と協力、ブルーのグラデーションは海・空・未来都市を象徴します。",sig:"シグネチャー（横・縦）",sigD:"シンボルとロゴタイプの組合せ。横型を基本とし、縦型は狭いスペースに使用します。",col:"専用色",colD:"ロゴの色は下記4色に規定します。",font:"専用書体",fontD:"ロゴタイプ：イ・スンシン ドトゥム B（韓国語）、Noto Sans Korean Bold（英語）。本文・ウェブ：Pretendard。",rule:"使用規定",rules:["シンボルの比率・色・構成要素を変形しない。","最小余白：シンボル高さの1/4以上。最小サイズ：横型30mm（印刷）/120px（ウェブ）。","暗い背景では反転型（白）、単色印刷はBlackまたはGray版を使用。","写真上では明るい領域または半透明の下地の上に配置。","定款上の公式英文名は Incheon Tourism Council（I.T.C）。ロゴタイプの表記は統一予定。[確認必要]"],dl:"CIダウンロード",symA:"カラー",symB:"グレー",symC:"ブラック",symR:"反転",member:"会員社エンブレム"},
 zh:{sym:"标志符号",symD:"蓝色圆形上的白色新月环抱仁川之海，内含仁川大桥主塔与帆（开港之海）及腾飞的飞机（门户仁川机场）。圆形象征包容与合作，蓝色渐变象征海洋、天空与未来之城。",sig:"标准组合（横向·纵向）",sigD:"符号与字标的组合。以横向为基本，狭窄空间使用纵向版本。",col:"专用色",colD:"标志颜色规定为以下四种。",font:"专用字体",fontD:"字标：韩文“李舜臣 Dotum B”，英文“Noto Sans Korean Bold”。正文及网页：Pretendard。",rule:"使用规范",rules:["不得改变符号的比例、颜色与构成要素。","最小留白：符号高度的1/4以上。最小尺寸：横向组合30mm（印刷）/120px（网页）。","深色背景使用反白版；单色印刷使用黑色或灰色版。","置于照片上时放在明亮区域或半透明底板上。","章程规定的官方英文名为 Incheon Tourism Council（I.T.C）。字标中的英文表述将统一。[待确认]"],dl:"下载CI",symA:"彩色",symB:"灰色",symC:"黑色",symR:"反白",member:"会员单位徽章"}

function renderOrg(o){
  // ---- SVG (desktop/tablet) ----
  const W=1400,H=640,P="#1d479c",P2="#3067b2",N="#0f2a62",L="#e8f0ff",G="#e9f5ec",GB="#9fcfae";
  const box=(x,y,w,h,t,sub,cls)=>{const fill=cls==="dark"?N:cls==="mid"?P2:cls==="light"?L:cls==="green"?G:"#fff";const stroke=cls==="green"?GB:cls==="dark"?N:cls==="mid"?P2:P;const tc=(cls==="dark"||cls==="mid")?"#fff":(cls==="green"?"#2b4a35":N);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`+(sub?`<text x="${x+w/2}" y="${y+h/2-6}" text-anchor="middle" font-size="${cls==="dark"?15:17}" font-weight="${cls==="dark"?500:700}" fill="${tc}">${t}</text><text x="${x+w/2}" y="${y+h/2+16}" text-anchor="middle" font-size="${cls==="dark"?24:13}" font-weight="${cls==="dark"?800:500}" fill="${tc}">${sub}</text>`:`<text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle" font-size="18" font-weight="700" fill="${tc}">${t}</text>`);};
  const ln=(x1,y1,x2,y2,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${d?"#8fa3c7":P2}" stroke-width="2.5" ${d?'stroke-dasharray="8 6"':""}/>`;
  const cx=700; let g="";
  g+=box(cx-120,20,240,44,o.ga,null,"light")+ln(cx,64,cx,86)+box(cx-120,86,240,44,o.board,null,"light")+ln(cx,130,cx,152);
  g+=box(cx-130,152,260,66,o.chairT,o.chair,"dark")+ln(cx,218,cx,240)+box(cx-120,240,240,44,o.svp,null,"")+ln(cx,284,cx,306);
  g+=ln(cx+120,42,cx+280,42,1)+box(cx+280,20,200,44,o.audit,null,"");
  g+=ln(cx-130,185,cx-290,185,1)+box(cx-500,163,210,44,o.adv,null,"");
  g+=ln(cx+130,185,cx+250,185,1)+box(cx+250,152,370,66,o.sec,o.secD,"");
  g+=`<rect x="40" y="306" width="${W-80}" height="46" rx="10" fill="#f4f7fb" stroke="${P2}" stroke-width="2"/><text x="${cx}" y="335" text-anchor="middle" font-size="18" font-weight="800" fill="${N}">${o.steer}  <tspan font-weight="500" fill="#4a5a78">|  ${o.steerD}</tspan></text>`;
  const oX=300,bX=1000; g+=ln(oX,352,oX,380)+ln(bX,352,bX,380);
  g+=box(oX-150,380,300,44,o.opsT,null,"mid")+box(bX-150,380,300,44,o.bizT,null,"mid");
  // ops 2x2
  const ow=240,oh=46,ogap=20; const ox=[oX-ow-ogap/2,oX+ogap/2];
  g+=ln(oX,424,oX,440)+ln(ox[0]+ow/2,440,ox[1]+ow/2,440)+ln(ox[0]+ow/2,440,ox[0]+ow/2,452)+ln(ox[1]+ow/2,440,ox[1]+ow/2,452);
  g+=box(ox[0],452,ow,oh,o.ops[0],null,"")+box(ox[1],452,ow,oh,o.ops[1],null,"");
  g+=ln(ox[0]+ow/2,498,ox[0]+ow/2,514)+ln(ox[1]+ow/2,498,ox[1]+ow/2,514)+box(ox[0],514,ow,oh,o.ops[2],null,"")+box(ox[1],514,ow,oh,o.ops[3],null,"");
  // biz 3 columns
  const bw=236,bgap=14; const bxs=[bX-bw*1.5-bgap,bX-bw/2,bX+bw/2+bgap];
  g+=ln(bX,424,bX,440)+ln(bxs[0]+bw/2,440,bxs[2]+bw/2,440);
  o.biz.forEach((b,i)=>{const x=bxs[i];g+=ln(x+bw/2,440,x+bw/2,452)+box(x,452,bw,46,b[0],null,"")+ln(x+bw/2,498,x+bw/2,514)+`<rect x="${x}" y="514" width="${bw}" height="60" rx="8" fill="${G}" stroke="${GB}" stroke-width="2"/><foreignObject x="${x+6}" y="518" width="${bw-12}" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 12.5px/1.35 Pretendard,sans-serif;color:#2b4a35;text-align:center;display:flex;align-items:center;justify-content:center;height:54px;word-break:keep-all">${b[1]}</div></foreignObject>`;});
  g+=`<text x="40" y="620" font-size="12.5" fill="#6b7684">${o.note}</text>`;
  g+=`<line x1="1030" y1="-6" x2="1070" y2="-6" stroke="${P2}" stroke-width="2.5"/><text x="1078" y="-2" font-size="12.5" fill="#4a5a78">${o.lg1}</text><line x1="1190" y1="-6" x2="1230" y2="-6" stroke="#8fa3c7" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1238" y="-2" font-size="12.5" fill="#4a5a78">${o.lg2}</text>`;
  const svg=`<svg class="orgsvg" viewBox="0 -24 ${W} ${H+24}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="organization chart" style="width:100%;height:auto;font-family:'Pretendard Variable',Pretendard,sans-serif">${g}</svg>`;
  // ---- Mobile portrait SVG (<=760px) ----
  const MW=420,mcx=210,fo=(x,y,w,h,txt,fs,col)=>`<foreignObject x="${x}" y="${y}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 ${fs}px/1.3 Pretendard,sans-serif;color:${col};text-align:center;display:flex;align-items:center;justify-content:center;height:${h}px;padding:0 4px;box-sizing:border-box;word-break:keep-all">${txt}</div></foreignObject>`;
  const mb=(x,y,w,h,t,cls,fs)=>{const fill=cls==="dark"?N:cls==="mid"?P2:cls==="light"?L:cls==="green"?G:cls==="steer"?"#f4f7fb":"#fff";const stroke=cls==="green"?GB:cls==="dark"?N:cls==="mid"?P2:cls==="side"?"#8fa3c7":P;const tc=(cls==="dark"||cls==="mid")?"#fff":(cls==="green"?"#2b4a35":N);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2"${cls==="side"?' stroke-dasharray="6 4"':""}/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="${fs||14}" font-weight="700" fill="${tc}">${t}</text>`;};
  let m="";
  // spine + top nodes
  m+=ln(mcx,54,mcx,110)+ln(mcx,154,mcx,240)+ln(mcx,306,mcx,328)+ln(mcx,372,mcx,394);
  m+=mb(100,10,220,44,o.ga,"light");
  m+=ln(mcx,80,330,80,1)+mb(330,64,80,32,o.audit,"side",13);
  m+=mb(100,110,220,44,o.board,"light");
  m+=ln(mcx,194,110,194,1)+mb(10,178,100,32,o.adv,"side",13);
  m+=ln(mcx,194,300,194,1)+`<rect x="300" y="162" width="110" height="64" rx="8" fill="#fff" stroke="#8fa3c7" stroke-width="2" stroke-dasharray="6 4"/><text x="355" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="${N}">${o.sec}</text>`+fo(302,184,106,40,o.secD,9.5,"#4a5a78");
  m+=`<rect x="100" y="240" width="220" height="66" rx="8" fill="${N}" stroke="${N}" stroke-width="2"/><text x="${mcx}" y="263" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">${o.chairT}</text><text x="${mcx}" y="290" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">${o.chair}</text>`;
  m+=mb(100,328,220,44,o.svp,"");
  m+=`<rect x="10" y="394" width="400" height="52" rx="10" fill="#f4f7fb" stroke="${P2}" stroke-width="2"/><text x="${mcx}" y="416" text-anchor="middle" font-size="15" font-weight="800" fill="${N}">${o.steer}</text><text x="${mcx}" y="435" text-anchor="middle" font-size="11" fill="#4a5a78">${o.steerD}</text>`;
  // two columns
  const lc=112.5,rc=307.5,cw=185;
  m+=ln(mcx,446,mcx,460)+ln(lc,460,rc,460)+ln(lc,460,lc,472)+ln(rc,460,rc,472);
  m+=ln(lc,516,lc,722)+ln(rc,516,rc,810);
  m+=mb(20,472,cw,44,o.opsT,"mid")+mb(215,472,cw,44,o.bizT,"mid");
  o.ops.forEach((x,i)=>{m+=mb(20,532+i*56,cw,44,x,"",13.5);});
  o.biz.forEach((b,i)=>{const y=532+i*128;m+=mb(215,y,cw,44,b[0],"",13.5)+`<rect x="215" y="${y+50}" width="${cw}" height="64" rx="8" fill="${G}" stroke="${GB}" stroke-width="2"/>`+fo(217,y+52,cw-4,60,b[1],11.5,"#2b4a35");});
  // note + legend
  m+=`<foreignObject x="10" y="920" width="400" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 10.5px/1.35 Pretendard,sans-serif;color:#6b7684;word-break:keep-all">${o.note}</div></foreignObject>`;
  m+=`<line x1="12" y1="996" x2="44" y2="996" stroke="${P2}" stroke-width="2.5"/><text x="52" y="1000" font-size="11.5" fill="#4a5a78">${o.lg1}</text><line x1="12" y1="1016" x2="44" y2="1016" stroke="#8fa3c7" stroke-width="2.5" stroke-dasharray="6 4"/><text x="52" y="1020" font-size="11.5" fill="#4a5a78">${o.lg2}</text>`;
  const mob=`<svg class="orgmob" viewBox="0 0 ${MW} 1030" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="organization chart" style="width:100%;height:auto;font-family:'Pretendard Variable',Pretendard,sans-serif">${m}</svg>`;
  return svg+mob;
}

window.onPageInit=function(){onPageRender();
  const tabs=document.querySelectorAll("#subtabs a");const secs=[...document.querySelectorAll("section[id]")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){tabs.forEach(a=>a.classList.toggle("active",a.dataset.tab===e.target.id));}}),{rootMargin:"-40% 0px -55% 0px"});
  secs.forEach(s=>io.observe(s));
};
</script>

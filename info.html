 zh:[{i:"train",t:"铁路·地铁",l:["<b>机场铁路(AREX)</b> 仁川机场 ↔ 首尔站 直达约43–51分钟","<b>仁川1号线</b> 桂阳（换乘机场铁路）— 富平 — 市厅 — 松岛 / <b>2号线</b> 黔丹 — 市厅","<b>水仁盆唐线·1号线</b> 仁川站（开港场·唐人街）— 富平 — 首尔","<b>GTX-B</b> 松岛 ↔ 首尔站 建设中 [待确认]"]},{i:"car",t:"巴士·观光巴士·出租车",l:["<b>仁川城市观光巴士</b> 自仁川站出发的环线及海洋线","<b>机场大巴</b> 至松岛、富平、九月洞主要酒店","<b>长途巴士</b> 自仁川综合巴士客运站出发","<b>出租车</b> 机场→松岛 30–40分钟 / →开港场 约50分钟"]},{i:"map",t:"港口·海岛·机场",l:["<b>仁川港沿岸客运站</b> — 德积、紫月、升凤、白翎、大青、延坪航线","<b>永宗三木码头</b> — 信·矢·茅岛、长峰岛（10–40分钟）","<b>江华</b> — 席毛岛、乔桐岛有桥相连","<b>仁川机场</b> 中转4小时以上可参加免费中转游（永宗、开港场、江华）— 咨询机场旅游咨询处"]}]};
let pg=1;const N=43;
function showPg(n){pg=Math.min(N,Math.max(1,n));const im=document.getElementById("flip-img");im.style.opacity=0;setTimeout(()=>{im.src=`assets/img/gb/p-${String(pg).padStart(2,"0")}.jpg`;im.onload=()=>im.style.opacity=1;},150);document.getElementById("flip-no").value=pg;document.querySelectorAll("#flip-thumbs img").forEach((t,i)=>t.style.outline=i+1===pg?"3px solid var(--c-sky)":"none");}
window.onPageRender=function(){
  const lg=getLang();
  document.getElementById("subtabs").innerHTML=[["books","info.booksT"],["flip","info.flipT"],["citytour","info.cityT"],["tic","info.ticT"],["transport","info.transT"]].map(([k,i])=>`<a href="#${k}">${t(i)}</a>`).join("");
  document.getElementById("book-grid").innerHTML=BOOKS.map((b,i)=>`<div class="book rv d${i%4}"><a class="cv" href="assets/docs/${b.file}" target="_blank" rel="noopener"><img src="assets/img/${b.cover}" alt="${L(b.n)}" loading="lazy"></a><div class="b"><h3>${L(b.n)}</h3><p>${L(b.d)}</p><div class="dl"><a class="btn btn-primary btn-sm" href="assets/docs/${b.file}" target="_blank" rel="noopener">${t("info.view")}</a><a class="btn btn-outline btn-sm" href="assets/docs/${b.file}" download>${t("common.download")}</a></div></div></div>`).join("");
  document.getElementById("tic-body").innerHTML=TICS.map(x=>`<tr><td><b>${L(x.n)}</b></td><td>${x.tel?`<a href="tel:${x.tel}">${x.tel}</a>`:"—"}</td><td>${x.h}</td></tr>`).join("");
  document.getElementById("hotline").innerHTML=(HOT[lg]||HOT.en).map(x=>`<li>${x}</li>`).join("");
  document.getElementById("trans").innerHTML=(TR[lg]||TR.en).map((s,i)=>`<div class="dir rv d${i}"><h3>${ICON[s.i]}${s.t}</h3><ul>${s.l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
  document.getElementById("flip-thumbs").innerHTML=Array.from({length:N},(_,i)=>`<img src="assets/img/gb/p-${String(i+1).padStart(2,"0")}.jpg" loading="lazy" style="height:48px;border-radius:4px;cursor:pointer;flex:none" data-p="${i+1}">`).join("");
  document.querySelectorAll("#flip-thumbs img").forEach(im=>im.onclick=()=>showPg(+im.dataset.p));
  showPg(pg);
};
window.onPageInit=function(){onPageRender();document.getElementById("flip-prev").onclick=()=>showPg(pg-1);document.getElementById("flip-next").onclick=()=>showPg(pg+1);document.getElementById("flip-no").onchange=e=>showPg(+e.target.value);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")showPg(pg+1);if(e.key==="ArrowLeft")showPg(pg-1);});
  let sx=0;const st=document.querySelector(".flip .stage");st.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});st.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)showPg(dx<0?pg+1:pg-1);});};
</script>
